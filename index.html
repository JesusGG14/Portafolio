<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portafolio</title>
    <meta name="description" content="Portafolio y currículum de desarrollo de software." />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeos
      try {
        const t = localStorage.getItem("tema");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="nav">
      <div class="contenedor nav__inner">
        <a href="#" class="nav__logo" id="nav-logo"></a>
        <nav class="tabs" aria-label="Secciones">
          <a href="#" data-vista="inicio">Inicio</a>
          <a href="#sobre-mi" data-vista="sobre-mi">Sobre mí</a>
          <a href="#proyectos" data-vista="proyectos">Proyectos</a>
        </nav>
        <button class="icon-btn" id="btn-tema" aria-label="Cambiar tema" title="Cambiar tema">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- ============ INICIO: bandeja de entrada ============ -->
      <section class="vista contenedor" data-vista="inicio">
        <div class="bienvenida">
          <div class="foto" id="inicio-foto"></div>
          <div>
            <p class="saludo">Hola, soy</p>
            <h1 id="inicio-nombre"></h1>
            <p class="rol" id="inicio-rol"></p>
            <p class="resumen" id="inicio-resumen"></p>
          </div>
        </div>

        <div class="bandeja">
          <div class="bandeja__cabecera">
            <h2>Bandeja de entrada</h2>
            <span id="bandeja-contador"></span>
          </div>
          <a href="#sobre-mi" class="mensaje">
            <span class="mensaje__icono" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            </span>
            <span class="mensaje__texto">
              <strong>Sobre mí</strong>
              <span id="mensaje-sobre"></span>
            </span>
            <span class="mensaje__meta">Currículum</span>
          </a>
          <a href="#proyectos" class="mensaje">
            <span class="mensaje__icono" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6 2 12l6 6M16 6l6 6-6 6"/></svg>
            </span>
            <span class="mensaje__texto">
              <strong>Proyectos</strong>
              <span id="mensaje-proyectos"></span>
            </span>
            <span class="mensaje__meta" id="meta-proyectos"></span>
          </a>
        </div>
      </section>

      <!-- ============ SOBRE MÍ: currículum ============ -->
      <section class="vista contenedor" data-vista="sobre-mi" hidden>
        <div class="cv-cabecera">
          <div class="foto foto--peq" id="cv-foto"></div>
          <div class="cv-cabecera__texto">
            <h1 id="cv-nombre"></h1>
            <p class="rol" id="cv-rol"></p>
          </div>
          <a href="#" class="btn btn--primario" id="btn-cv">Descargar CV</a>
        </div>

        <div class="cv">
          <div class="cv__principal">
            <section class="bloque">
              <h2 class="bloque__titulo">Perfil profesional</h2>
              <div id="cv-sobre"></div>
            </section>
            <section class="bloque">
              <h2 class="bloque__titulo">Experiencia profesional</h2>
              <ol class="timeline" id="lista-experiencia"></ol>
            </section>
            <section class="bloque">
              <h2 class="bloque__titulo">Formación académica</h2>
              <ol class="timeline" id="lista-formacion"></ol>
            </section>
          </div>

          <aside class="cv__lateral">
            <section class="tarjeta">
              <h2 class="bloque__titulo">Contacto</h2>
              <dl class="datos" id="cv-datos"></dl>
            </section>
            <section class="tarjeta">
              <h2 class="bloque__titulo">Conocimientos técnicos</h2>
              <div id="lista-habilidades"></div>
            </section>
            <section class="tarjeta" id="bloque-certificaciones" hidden>
              <h2 class="bloque__titulo">Cursos y certificaciones</h2>
              <ul class="certificaciones" id="lista-certificaciones"></ul>
            </section>
            <section class="tarjeta">
              <h2 class="bloque__titulo">Idiomas</h2>
              <ul class="idiomas" id="lista-idiomas"></ul>
            </section>
          </aside>
        </div>
      </section>

      <!-- ============ PROYECTOS ============ -->
      <section class="vista contenedor" data-vista="proyectos" hidden>
        <h1 class="vista__titulo">Proyectos</h1>
        <div class="filtros" id="filtros" role="toolbar" aria-label="Filtrar por tecnología"></div>
        <div class="proyectos" id="lista-proyectos"></div>
      </section>
    </main>

    <footer class="pie">
      <ul class="redes" id="pie-redes"></ul>
      <p id="pie-texto"></p>
    </footer>

    <dialog class="modal" id="modal-proyecto">
      <button class="icon-btn modal__cerrar" id="modal-cerrar" aria-label="Cerrar">✕</button>
      <div id="modal-contenido"></div>
    </dialog>

    <script src="data/perfil.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
